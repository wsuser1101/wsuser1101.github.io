site_name: VMX-Pi Documentation
site_url: https://wsuser1101.github.io/
site_description: Setup and development guides for VMX-Pi on WPILib and W4Studica.

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.footer
    - navigation.top
    - content.code.copy

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: index.md
  - VMX-Pi on WPILib:
      - Introduction: vmxonwpi/index.md
      - VMX-Pi Setup: vmxonwpi/guides/vmx-pi/vmx-pi-setup.md
      - VMX-Pi Network: vmxonwpi/guides/vmx-pi/vmx-pi-network.md
      - Install WPILib and VMX2026: vmxonwpi/guides/vmx-pi/software-install.md
      - VS Code Setup: vmxonwpi/guides/vmx-pi/vscode-setup.md
      - Connect a Project to VMX-Pi: vmxonwpi/guides/vmx-pi/vmx2026-setup.md
      - Start Robot Coding: vmxonwpi/guides/vmx-pi/start-robot-coding.md
      - Studica APIs: vmxonwpi/guides/vmx-pi/studica-api.md
      - Hardware Support: vmxonwpi/guides/vmx-pi/hardware-support.md
      - Troubleshooting: vmxonwpi/guides/vmx-pi/troubleshooting.md
      - C++ API: /vmxonwpi/apidocs/
      - Java API: /vmxonwpi/javadocs/
  - W4Studica:
      - Introduction: W4Studica/index.md
      - VMX-Pi Setup: W4Studica/guides/vmx-pi/vmx-pi-setup.md
      - VMX-Pi Network: W4Studica/guides/vmx-pi/vmx-pi-network.md
      - Software Install: W4Studica/guides/vmx-pi/software-install.md
      - VS Code Setup: W4Studica/guides/vmx-pi/vscode-setup.md
      - Adding W4Studica Libraries: W4Studica/guides/vmx-pi/adding-w4studica-libraries.md
      - Start Robot Coding: W4Studica/guides/vmx-pi/start-robot-coding.md
      - Hardware Support: W4Studica/guides/vmx-pi/hardware-support.md
      - Troubleshooting: W4Studica/guides/vmx-pi/troubleshooting.md
      - C++ API: /W4Studica/apidocs/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: false
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
          site_name: VMX-Pi Documentation
          site_description: Setup and development guides for VMX-Pi on WPILib and W4Studica.
        - locale: ko
          name: 한국어
          build: true
          theme:
            language: ko
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                toggle:
                  icon: material/weather-night
                  name: 어두운 모드로 전환
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                toggle:
                  icon: material/weather-sunny
                  name: 밝은 모드로 전환
          site_name: VMX-Pi 문서
          site_description: VMX-Pi on WPILib과 W4Studica의 설정 및 개발 문서입니다.
          nav_translations:
            Home: 홈
            Introduction: 소개
            VMX-Pi Setup: VMX-Pi 설정
            VMX-Pi Network: VMX-Pi 네트워크
            Software Install: 소프트웨어 설치
            Adding W4Studica Libraries: W4Studica 라이브러리 추가
            C++ API: C++ API 문서
            Java API: Java API 문서
            Install WPILib and VMX2026: WPILib 및 VMX2026 설치
            VS Code Setup: VS Code 설정
            Connect a Project to VMX-Pi: 프로젝트를 VMX-Pi에 연결
            Start Robot Coding: 로봇 코딩 시작하기
            Studica APIs: Studica API 사용법
            Hardware Support: 하드웨어 지원
            Troubleshooting: 문제 해결
