name: Deploy documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Read pinned API sources
        id: api-source
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          source = json.load(open('apidocs/source.json'))
          print('ref=' + source['ref'])
          vmx_source = json.load(open('apidocs/vmxonwpi/source.json'))
          print('vmx_repository=' + vmx_source['repository'])
          print('vmx_ref=' + vmx_source['ref'])
          PY
      - name: Check out pinned API source
        uses: actions/checkout@v6
        with:
          repository: W4Studica/allwpilib
          ref: ${{ steps.api-source.outputs.ref }}
          path: .sources/allwpilib
          persist-credentials: false
      - name: Check out pinned VMX on WPI API source
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.api-source.outputs.vmx_repository }}
          ref: ${{ steps.api-source.outputs.vmx_ref }}
          path: .sources/vmxonwpi-allwpilib
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: pip
      - name: Set up Java API tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install documentation dependencies
        run: python -m pip install -r requirements.txt
      - name: Build site
        run: mkdocs build --strict
      - name: Install API documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz
      - name: Build W4Studica API documentation
        run: python scripts/build_apidocs.py --allwpilib .sources/allwpilib
      - name: Build VMX on WPI API documentation
        run: python scripts/build_apidocs.py --project vmxonwpi --allwpilib .sources/vmxonwpi-allwpilib
      - name: Build VMX on WPI Java API documentation
        run: python scripts/build_javadocs.py --allwpilib .sources/vmxonwpi-allwpilib
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
